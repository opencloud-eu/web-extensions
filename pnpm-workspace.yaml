preferWorkspacePackages: true
packages:
  - 'packages/*'
  - 'tests/*'

autoInstallPeers: true
sharedWorkspaceLockfile: true
minimumReleaseAge: 720

# public so they are picked up by IDEs
publicHoistPattern:
  - '*eslint*'

overrides:
  '@module-federation/vite': '1.14.2'
  # security updates
  '@module-federation/dts-plugin>axios': ^1.6.0
  lodash-es: ^4.18.0
  '@node-minify/core>glob': ^13.0.0
  adm-zip: ^0.6.0

allowBuilds:
  '@parcel/watcher': true
