prefer-workspace-packages: true
packages:
  - 'packages/*'
  - 'tests/*'

autoInstallPeers: true
sharedWorkspaceLockfile: true
minimumReleaseAge: 720

# public so they are picked up by IDEs
publicHoistPattern:
  - '*eslint*'

overrides:
  '@module-federation/vite': '1.14.2'
  '@module-federation/dts-plugin>axios': ^1.6.0
  # web-pkg from the local web consolidation branch (motion photos +
  # warnBeforeUnload); drop once a web release ships these
  '@opencloud-eu/web-pkg': 'file:/home/domme/dev/sources/opencloud-eu/web-pkg-consolidation.tgz'

allowBuilds:
  '@parcel/watcher': true
minimumReleaseAgeExclude:
  # Renovate security update: vite@8.0.16
  - vite@8.0.16
  - '@opencloud-eu/extension-sdk@7.3.0-alpha.1'
  - '@opencloud-eu/web-test-helpers@7.3.0'
